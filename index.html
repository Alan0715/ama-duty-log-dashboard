<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日效期检查表核验看板</title>
<style>
  :root {
    --bg:#F5EFE6; --card:#FBF7F0; --ink:#2b2b2b; --muted:#6b6256;
    --line:#e4dccd; --brand:#8a5a2b; --ok:#2e7d32; --bad:#c62828; --warn:#e08600;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif; font-size:14px; }
  header { background:var(--card); border-bottom:2px solid var(--line); padding:18px 26px; }
  h1 { margin:0; font-size:20px; color:#3a2c1a; letter-spacing:.5px; }
  .sub { color:var(--muted); font-size:12.5px; margin-top:4px; }
  .wrap { padding:18px 26px 40px; }
  .filters { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end;
    background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:16px; }
  .filters label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  select { background:#fff; border:1px solid var(--line); border-radius:7px; padding:7px 10px;
    font-size:13.5px; color:var(--ink); min-width:140px; }
  .summary { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:18px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:12px 18px; min-width:120px; }
  .stat .n { font-size:24px; font-weight:700; color:#3a2c1a; }
  .stat .l { font-size:12px; color:var(--muted); margin-top:2px; }
  .stat.bad .n { color:var(--bad); }
  .stat.warn .n { color:var(--warn); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line);
    border-radius:10px; overflow:hidden; }
  th,td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
  th { background:#efe6d6; color:#4a3a26; font-weight:600; font-size:12.5px; }
  tr:last-child td { border-bottom:none; }
  .badge { display:inline-block; padding:2px 9px; border-radius:11px; font-size:12px; font-weight:600; }
  .b-ok { background:#e3f1e4; color:var(--ok); }
  .b-bad { background:#fbe3e3; color:var(--bad); }
  .b-warn { background:#fdf0db; color:var(--warn); }
  .b-gray { background:#ece7dd; color:#6b6256; }
  .issues { color:var(--bad); font-size:12.5px; }
  .thumb { max-width:80px; max-height:104px; border:1px solid var(--line); border-radius:6px; cursor:pointer; display:block; }
  .imgside { display:inline-block; vertical-align:top; margin-right:8px; }
  .store { font-weight:600; color:#3a2c1a; }
  .muted { color:var(--muted); }
  a { color:var(--brand); }
  .legend { font-size:12px; color:var(--muted); margin-top:14px; line-height:1.7; }
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.8); display:none; align-items:center;
    justify-content:center; z-index:50; }
  .lightbox img { max-width:92vw; max-height:92vh; border-radius:8px; }
  .lightbox .lbtitle { position:absolute; top:18px; left:0; right:0; text-align:center;
    color:#fff; font-size:15px; font-weight:600; text-shadow:0 1px 4px rgba(0,0,0,.7); padding:0 20px; }
</style>
</head>
<body>
<header>
  <h1>每日效期检查表核验看板</h1>
  <div class="sub" id="subtitle"></div>
</header>
<div class="wrap">
  <div class="filters">
    <div><label>日期</label><select id="f-date"></select></div>
    <div><label>区域</label><select id="f-region"></select></div>
    <div><label>城市</label><select id="f-city"></select></div>
    <div><label>门店</label><select id="f-store"></select></div>
    <div><label>提交状态</label><select id="f-status">
      <option value="ALL">全部</option>
      <option value="nolog">未提交日志</option>
      <option value="suspect">异常疑似</option>
      <option value="ok">正常</option>
    </select></div>
    <div><label>是否重复图</label><select id="f-dup">
      <option value="ALL">全部</option>
      <option value="yes">是</option>
      <option value="no">否</option>
    </select></div>
  </div>
  <div class="summary" id="summary"></div>
  <table>
    <thead><tr>
      <th>门店</th><th>区域</th><th>值班日志提交日期</th><th>提交人</th>
      <th>重复图</th><th>异常说明</th>
      <th>效期表照片</th><th>每日报数照片</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="legend">
    说明：① 提交状态口径 ——「未提交日志」指该门店当日<b>根本没有提交值班管理日志</b>（完全缺席，纳入缺失追责）；其余已提交日志的门店再按「异常疑似 / 正常」区分。
    ② 重复图=该图片 sha256 与「异常说明」中标注的其他日期/门店记录完全一致（跨日或跨店复用，疑似顶替）。
    ③ 「效期表照片」列展示「每日效期检查表」缩略图（点击可放大，下方为钉钉效期原图链接）；「每日报数照片」列展示「每日报数」缩略图（点击可放大，下方为钉钉报数原图链接）。两列独立呈现，缺失任一张时该列显示"—"。
  </div>
</div>
<div class="lightbox" id="lb" onclick="this.style.display='none'">
  <div class="lbtitle" id="lbtitle"></div>
  <img id="lbimg" src="" onclick="event.stopPropagation()">
</div>

const records = DATA.records;

function uniq(a){ return [...new Set(a)]; }
// 未提交日志：该门店当日根本没有提交「值班管理日志」（无日志记录）
function isNoLog(r){ return r.status==='missing' || !r.report_id; }
// 分类：nolog=未提交日志；suspect=异常疑似（含已提交但无表/重复图等）；ok=正常
function cat(r){
  if(isNoLog(r)) return 'nolog';
  if(!r.has_expiry_table || r.status==='suspect') return 'suspect';
  return 'ok';
}

// 填充筛选器（区域/城市/门店 均以日志记录中实际出现的为准，不再依赖组织架构文件排序）
const dates = uniq(records.map(r=>r.date).filter(Boolean)).sort().reverse();
const regions = uniq(records.map(r=>r.region).filter(Boolean)).sort();
const CITY_ORDER = ['深圳','广州','东莞','佛山','厦门','珠海'];
const cityRank = c => { const i = CITY_ORDER.indexOf(c); return i < 0 ? 1e9 : i; };
const cities = uniq(records.map(r=>r.city).filter(Boolean)).sort((a,b)=>cityRank(a)-cityRank(b));
const cityOf = {};
records.forEach(r=>{ if(r.store && r.city) cityOf[r.store]=r.city; });
const fDate=document.getElementById('f-date'), fRegion=document.getElementById('f-region'),
      fCity=document.getElementById('f-city'), fStore=document.getElementById('f-store'),
      fStatus=document.getElementById('f-status'), fDup=document.getElementById('f-dup');
fDate.innerHTML = '<option value="ALL">全部日期</option>' + dates.map(d=>`<option value="${d}">${d}</option>`).join('');
fRegion.innerHTML = '<option value="ALL">全部区域</option>' + regions.map(r=>`<option value="${r}">${r}</option>`).join('');
fCity.innerHTML = '<option value="ALL">全部城市</option>' + cities.map(c=>`<option value="${c}">${c}</option>`).join('');
function fillStores(){
  let stores = uniq(records.map(r=>r.store));
  // 门店下拉按"日志中的城市"分组排序，不再用组织架构 store_order
  stores.sort((a,b)=> (cityRank(cityOf[a])-cityRank(cityOf[b])) || (a<b?-1:1));
  fStore.innerHTML = '<option value="ALL">全部门店</option>' + stores.map(s=>`<option value="${s}">${s}</option>`).join('');
}
fillStores();

// 默认显示最新日志日期（以日志内部日期为主，而非浏览器本地前一日）；若该日无数据则回退「全部日期」
(function(){
  if(dates.length) fDate.value = dates[0];
})();

let scopeTxt = DATA.scope_market ? '范围：' + DATA.scope_market + '　|　' : '';
document.getElementById('subtitle').textContent =
  '模板：' + (DATA.template_name||'') + '　|　' + scopeTxt + '数据更新：' + (DATA.updated_at||'') + '　|　共 ' + records.length + ' 条记录';

function badge(text, cls){ return `<span class="badge ${cls}">${text}</span>`; }

function fmtSubmit(ts){
  if(ts===undefined || ts===null || ts==='') return '—';
  let n = Number(ts);
  if(!n) return '—';
  // 兼容毫秒/秒级时间戳
  if(n < 1e12) n *= 1000;
  const d = new Date(n);
  if(isNaN(d.getTime())) return String(ts);
  const p = x => String(x).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function render(){
  const d=fDate.value, rg=fRegion.value, ct=fCity.value, st=fStore.value, statSel=fStatus.value,
        dupSel=fDup.value;
  let rows = records.filter(r=>{
    if(d!=='ALL' && r.date!==d) return false;
    if(rg!=='ALL' && (r.region||'')!==rg) return false;
    if(ct!=='ALL' && (r.city||'')!==ct) return false;
    if(st!=='ALL' && r.store!==st) return false;
    const c=cat(r);
    if(statSel!=='ALL' && c!==statSel) return false;
    const isDup = !!(r.forensics && (r.forensics.duplicate_with||[]).length);
    if(dupSel==='yes' && !isDup) return false;
    if(dupSel==='no' && isDup) return false;
    return true;
  });
  // 汇总
  const total=rows.length;
  const noLog=rows.filter(r=>cat(r)==='nolog').length;
  const susp=rows.filter(r=>cat(r)==='suspect').length;
  const dup=rows.filter(r=>r.forensics && (r.forensics.duplicate_with||[]).length).length;
  const sum=document.getElementById('summary');
  sum.innerHTML = [
    stat(total,'门店记录'),
    stat(noLog,'未提交日志','bad'),
    stat(susp,'异常疑似','warn'), stat(dup,'重复图','warn')
  ].join('');

  const tb=document.getElementById('tbody');
  if(!rows.length){ tb.innerHTML='<tr><td colspan="8" class="muted">无匹配记录</td></tr>'; return; }
  tb.innerHTML = rows.map(r=>{
    const f=r.forensics||{};
    const c=cat(r);
    const edit = f.edited ? badge('是('+f.edited_software+')','b-warn') : badge('否','b-ok');
    const dups = f.duplicate_with||[];
    const dupB = dups.length ? badge('重复','b-warn') : badge('否','b-ok');
    const issues = (r.issues&&r.issues.length)? r.issues.map(x=>`·${x}`).join('<br>'):'<span class="muted">—</span>';
    const img = r.image_local ? `<div class="imgside"><img class="thumb" src="${r.image_local}" data-store="${(r.store||'').replace(/"/g,'&quot;')}" data-date="${r.date||''}" onclick="show(this.src,this.dataset.store,this.dataset.date)"></div>` : '';
    const rimg = r.report_image_local ? `<div class="imgside"><img class="thumb" src="${r.report_image_local}" data-store="${(r.store||'').replace(/"/g,'&quot;')}" data-date="${r.date||''}（每日报数）" onclick="show(this.src,this.dataset.store,this.dataset.date)"></div>` : '';
    const orig = r.image_url? `<a href="${r.image_url}" target="_blank">效期原图</a>`:'';
    const rorig = r.report_image_url? ` <a href="${r.report_image_url}" target="_blank">报数原图</a>`:'';
    const expCell = img ? img + `<div style="margin-top:4px">${orig}</div>` : '<span class="muted">—</span>';
    const repCell = rimg ? rimg + `<div style="margin-top:4px">${rorig}</div>` : '<span class="muted">—</span>';
    // 列显示提交时间（createTime）；日期筛选仍以日志内部「日期」(r.date) 为准（见顶部 f-date 填充）
    const dutyCell = r.submit_time ? fmtSubmit(r.submit_time) : '<span class="muted">—</span>';
    return `<tr>
      <td class="store">${r.store||'—'}</td>
      <td>${r.region||'—'}</td>
      <td>${dutyCell}</td>
      <td>${r.creator||'—'}</td>
      <td>${dupB}</td>
      <td class="issues">${issues}</td>
      <td>${expCell}</td>
      <td>${repCell}</td>
    </tr>`;
  }).join('');
}
function stat(n,l,cls){ return `<div class="stat ${cls||''}"><div class="n">${n}</div><div class="l">${l}</div></div>`; }

function show(p, store, date){
  document.getElementById('lbimg').src=p;
  document.getElementById('lbtitle').textContent = (store||'') + (date? ' · '+date : '');
  document.getElementById('lb').style.display='flex';
}

[fDate,fRegion,fCity,fStore,fStatus,fDup].forEach(el=>el.addEventListener('change',()=>{ render(); }));
render();
</script>
</body>
</html>
